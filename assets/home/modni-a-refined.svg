<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-labelledby="title desc"><title id="title">모드니 A 정교한 투명 시안</title><desc id="desc">매끈한 주황색 원 둘레. 왼쪽은 크고 조금 아래에, 오른쪽은 작고 조금 위에 놓인 짝눈. 배경 없음.</desc><circle cx="50" cy="50" r="43" stroke="#f4581c" stroke-width="6.4"/><circle cx="42.4" cy="48" r="5" fill="#f4581c"/><circle cx="59.6" cy="44.2" r="3.8" fill="#f4581c"/></svg>
