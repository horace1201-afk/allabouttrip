<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>여행의 모든것</title>
<!-- 🆕 9/22 미니홈피 P-4: GitHub Pages 는 경로 라우팅이 없어 /u/<handle> 이 404 로 떨어진다 → 여기서 /u.html?h=<handle> 로 넘긴다 (쿼리 ?t=… 보존).
     /u/ 가 아닌 경로는 홈 링크만 — 이 파일은 그 이상 키우지 않는다 -->
<script>
(function(){
  var m = location.pathname.match(/^\/u\/([^/?#]+)/);
  if (!m) return;
  var q = new URLSearchParams(location.search);
  q.set("h", decodeURIComponent(m[1]).replace(/^@/, ""));
  location.replace("/u.html?" + q.toString() + location.hash);
})();
</script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;color:#1D1B19;background:#FAF8F5}
h1{font-size:20px;margin:0 0 8px}p{color:#6B6570;font-size:14px;margin:0 0 20px}
a{display:inline-block;background:#F4581C;color:#fff;font-weight:800;border-radius:999px;padding:12px 22px;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div><h1>페이지를 찾을 수 없어요</h1><p>주소가 바뀌었거나 없는 페이지예요.</p><a href="/">여행의 모든것 홈으로</a></div>
</body>
</html>
